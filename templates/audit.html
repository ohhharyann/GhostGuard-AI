{% extends 'base.html' %}{% set title='Audit Logs' %}{% block body %}<div class="bar"><div><h1>Audit logs</h1><p class="m">Latest 300 recorded actions.</p></div></div><div class="card flush"><div class="tw"><table><thead><tr><th>When (UTC)</th><th>User</th><th>Action</th><th>Record</th></tr></thead><tbody>{% for r in rows %}<tr><td class="num">{{ r.at.strftime('%Y-%m-%d %H:%M:%S') }}</td><td>{{ r.user }}</td><td>{{ r.action }}</td><td style="white-space:normal">{{ r.target }}</td></tr>{% else %}<tr><td colspan="4"><div class="empty"><p>No activity yet.</p></div></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
